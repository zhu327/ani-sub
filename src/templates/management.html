<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anime Subscriptions</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f5f5f5;color:#333;-webkit-text-size-adjust:100%}
button,input{font:inherit}
button{min-height:44px;touch-action:manipulation}
header{background:#4a90d9;color:#fff;padding:1rem 1.5rem;display:flex;justify-content:space-between;align-items:center;gap:1rem;position:sticky;top:0;z-index:10}
header h1{font-size:1.2rem;font-weight:600;line-height:1.25}
header button{background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.3);padding:8px 16px;border-radius:8px;cursor:pointer;font-size:14px;flex:0 0 auto}
header button:hover{background:rgba(255,255,255,.3)}
.container{max-width:800px;margin:1.5rem auto;padding:0 1rem}
.toolbar{display:flex;justify-content:flex-end;margin-bottom:1rem}
.btn-add{background:#27ae60;color:#fff;border:none;padding:10px 20px;border-radius:10px;cursor:pointer;font-size:14px;font-weight:600}
.btn-add:hover{background:#219a52}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 1px 5px rgba(0,0,0,.08)}
th,td{padding:12px 16px;text-align:left;border-bottom:1px solid #f0f0f0;vertical-align:top}
th{background:#fafafa;font-weight:600;font-size:13px;color:#666}
td{font-size:14px;word-break:break-word}
tr:last-child td{border-bottom:none}
.actions{white-space:nowrap}
.actions button{border:none;padding:8px 12px;border-radius:8px;cursor:pointer;font-size:13px;margin-right:4px;min-height:36px}
.btn-edit{background:#eef;color:#4a90d9}
.btn-edit:hover{background:#dde8ff}
.btn-del{background:#fef0f0;color:#e74c3c}
.btn-del:hover{background:#fde}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;justify-content:center;align-items:center;z-index:100;padding:1rem}
.overlay.active{display:flex}
.modal{background:#fff;padding:1.5rem;border-radius:12px;width:100%;max-width:450px;box-shadow:0 4px 20px rgba(0,0,0,.15)}
.modal h3{margin-bottom:1rem;color:#333}
.modal label{display:block;font-size:13px;color:#666;margin:12px 0 4px}
.modal input{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;font-size:16px}
.modal input:focus{outline:none;border-color:#4a90d9}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:1.5rem}
.modal-actions button{padding:10px 20px;border-radius:8px;cursor:pointer;font-size:14px;border:1px solid #ddd;min-height:44px}
.btn-cancel{background:#fff;color:#666}
.btn-cancel:hover{background:#f5f5f5}
.btn-save{background:#4a90d9;color:#fff;border-color:#4a90d9}
.btn-save:hover{background:#357abd}
.empty{text-align:center;padding:3rem 1rem;color:#999}
@media (max-width:600px){
    header{padding:calc(.85rem + env(safe-area-inset-top)) 1rem .85rem;align-items:flex-start}
    header h1{font-size:1.05rem;max-width:12rem}
    header button{padding:8px 12px}
    .container{margin:1rem auto;padding:0 .75rem}
    .toolbar{position:sticky;top:70px;z-index:9}
    .btn-add{width:100%;font-size:16px}
    table,thead,tbody,tr,td{display:block;width:100%}
    table{background:transparent;box-shadow:none;border-radius:0}
    thead{display:none}
    tr{background:#fff;border-radius:12px;box-shadow:0 1px 5px rgba(0,0,0,.08);margin-bottom:.75rem;overflow:hidden}
    td{display:flex;justify-content:space-between;gap:1rem;padding:12px 14px;border-bottom:1px solid #f0f0f0;font-size:15px}
    td::before{content:attr(data-label);color:#777;font-size:13px;font-weight:600;flex:0 0 5.5rem}
    td.actions{display:flex;white-space:normal;gap:8px}
    td.actions::before{padding-top:10px}
    .actions button{flex:1;margin:0;font-size:14px;min-height:44px}
    .overlay{align-items:flex-end;padding:0}
    .modal{max-width:none;border-radius:16px 16px 0 0;padding:1.25rem 1rem calc(1rem + env(safe-area-inset-bottom))}
    .modal-actions{gap:10px}
    .modal-actions button{flex:1;font-size:16px}
}
</style>
</head>
<body>
<header>
<h1>🎬 Anime Subscriptions</h1>
</header>
<div class="container">
<div class="toolbar">
<button class="btn-add" onclick="showModal()">+ Add</button>
</div>
<table>
<thead><tr><th>Keywords</th><th>Exclude</th><th>Indexer</th><th style="width:120px">Actions</th></tr></thead>
<tbody id="tb"></tbody>
</table>
<div id="empty" class="empty" style="display:none">No subscriptions yet</div>
</div>
<div class="overlay" id="ov" onclick="if(event.target===this)hideModal()">
<div class="modal">
<h3 id="mt">Add Subscription</h3>
<input type="hidden" id="eid">
<label>Keywords</label>
<input id="kw" placeholder="e.g. LoliHouse 迷宫饭">
<label>Exclude Keywords</label>
<input id="ek" placeholder="Optional">
<label>Indexer ID</label>
<input id="idx" type="number" placeholder="Optional, uses default if empty">
<div class="modal-actions">
<button class="btn-cancel" onclick="hideModal()">Cancel</button>
<button class="btn-save" onclick="saveAnime()">Save</button>
</div>
</div>
</div>
<script>
const API='/api/anime';
const $=id=>document.getElementById(id);
let data=[];

async function load(){
    const r=await fetch(API);
    if(!r.ok){alert('加载失败 (HTTP '+r.status+')');return;}
    data=(await r.json()).data||[];
    render();
}

function render(){
    const tb=$('tb'),em=$('empty');
    em.style.display=data.length?'none':'block';
    tb.innerHTML=data.length?data.map(a=>`<tr>
        <td data-label="Keywords">${esc(a.keywords)}</td>
        <td data-label="Exclude">${esc(a.exclude_keywords||'-')}</td>
        <td data-label="Indexer">${a.indexer??'-'}</td>
        <td class="actions" data-label="Actions">
            <button class="btn-edit" onclick="showModal(${a.id})">Edit</button>
            <button class="btn-del" onclick="delAnime(${a.id})">Delete</button>
        </td></tr>`).join(''):'';
}

function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}

function showModal(id){
    $('ov').classList.add('active');
    const isEdit=id!=null;
    const a=isEdit?data.find(x=>x.id===id):{};
    $('mt').textContent=isEdit?'Edit Subscription':'Add Subscription';
    $('eid').value=a.id||'';
    $('kw').value=a.keywords||'';
    $('ek').value=a.exclude_keywords||'';
    $('idx').value=a.indexer||'';
    if(!matchMedia('(max-width:600px)').matches)$('kw').focus();
}

function hideModal(){$('ov').classList.remove('active');}

async function saveAnime(){
    const id=$('eid').value;
    const keywords=$('kw').value.trim();
    if(!keywords){alert('Keywords required');return;}
    const body={
        keywords,
        exclude_keywords:$('ek').value.trim(),
        indexer:$('idx').value?Number($('idx').value):null
    };
    const url=id?`${API}/${id}`:API;
    await fetch(url,{method:id?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    hideModal();load();
}

async function delAnime(id){
    if(!confirm('Delete this subscription?'))return;
    await fetch(`${API}/${id}`,{method:'DELETE'});load();
}

load();
</script>
</body>
</html>
